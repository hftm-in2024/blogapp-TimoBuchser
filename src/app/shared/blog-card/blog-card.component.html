<mat-card>
  @if (model().headerImageUrl) {
    <img mat-card-image [src]="model().headerImageUrl" [alt]="model().title" />
  }

  <mat-card-header>
    <mat-card-title>
      <a [routerLink]="['/blog', model().id]">{{ model().title }}</a>
    </mat-card-title>
    <mat-card-subtitle>von {{ model().author }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ model().contentPreview }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-icon-button type="button" aria-label="Blog liken" (click)="onLike()">
      <mat-icon>{{ model().likedByMe ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
    <span>{{ model().likes }}</span>
    <a mat-button [routerLink]="['/blog', model().id]">Weiterlesen</a>

    @if (model().createdByMe) {
      <button mat-button type="button" (click)="edited.emit(model())">Bearbeiten</button>
      <button mat-button type="button" (click)="deleted.emit(model().id)">Löschen</button>
    }
  </mat-card-actions>
</mat-card>
